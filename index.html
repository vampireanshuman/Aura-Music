<html lang="en" class="dark">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="theme-color" content="#07080c" />
    <title>Aura Music | Apple Music Experience</title>
    
    <style>
      html, body {
        background-color: #07080c !important;
        background: #07080c !important;
        color: #f5f5f7 !important;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root:empty {
        background-color: #07080c;
        height: 100vh;
        width: 100vw;
      }
      @keyframes auraPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 20px rgba(250, 45, 72, 0.6)); }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body class="bg-[#07080c] text-[#f5f5f7] antialiased selection:bg-[#fa2d48]/40 selection:text-white overflow-x-hidden font-sans">
    <div id="root">
      <div style="position:fixed;inset:0;background:#07080c;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,sans-serif;z-index:9999;">
        <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#fa2d48,#f95f70);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 35px rgba(250,45,72,0.45);animation:auraPulse 2s infinite ease-in-out;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        </div>
        <div style="margin-top:16px;font-size:13px;font-weight:600;letter-spacing:-0.02em;color:rgba(255,255,255,0.7);">
          Aura Music
        </div>
      </div>
    </div>
    <!-- Hidden persistent container for YouTube audio engine -->
    <div id="aura-youtube-player-host" style="position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
