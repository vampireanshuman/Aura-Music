name: Release Aura Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup API 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Persistent Release Keystore
        run: |
          echo "Restoring persistent release keystore..."
          echo "" | base64 -d > aura-release-key.jks
          cp aura-release-key.jks app/aura-release-key.jks
          cat << 'EOF' > keystore.properties
          storeFile=aura-release-key.jks
          storePassword=auramusic123
          keyAlias=aura-key
          keyPassword=auramusic123
          EOF

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :core:lyrics:test :player:testDebugUnitTest :sources:addon:test :sources:youtube:test --stacktrace

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          AURA_KEYSTORE_FILE: aura-release-key.jks
          AURA_KEYSTORE_PASSWORD: auramusic123
          AURA_KEY_ALIAS: aura-key
          AURA_KEY_PASSWORD: auramusic123
          AETHER_KEYSTORE_FILE: aura-release-key.jks
          AETHER_KEYSTORE_PASSWORD: auramusic123
          AETHER_KEY_ALIAS: aura-key
          AETHER_KEY_PASSWORD: auramusic123

      - name: Stage Release APK & Checksums
        run: |
          mkdir -p release_assets
          TAG_VAL="${{ github.ref_name || inputs.tag_name || 'v1.2.2' }}"
          
          # Find release APK
          APK_FILE=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_assets/AuraMusic-release.apk
            cp "$APK_FILE" "release_assets/Aura-Music-${TAG_VAL}.apk"
            cp "$APK_FILE" "release_assets/Aura-${TAG_VAL}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum AuraMusic-release.apk > AuraMusic-release.apk.sha256
          sha256sum "Aura-Music-${TAG_VAL}.apk" > "Aura-Music-${TAG_VAL}.apk.sha256"
          sha256sum "Aura-${TAG_VAL}.apk" > "Aura-${TAG_VAL}.apk.sha256"
          echo "Release artifacts staged:"
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/AuraMusic-release.apk
            release_assets/AuraMusic-release.apk.sha256
            release_assets/Aura-Music-*.apk
            release_assets/Aura-Music-*.apk.sha256
            release_assets/Aura-*.apk
            release_assets/Aura-*.apk.sha256
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Aura Music ${{ github.ref_name || inputs.tag_name }}"
          body: |
            **Aura Music ${{ github.ref_name || inputs.tag_name }}** brings upstream AETHER v2.0.0 to Aura — lyrics from seven libraries drawn three ways, on-device romanisation, crossfade, better lossless copies found mid-song, music videos, kept files exported to `Music/Aura`, offline album shelves, and in-app updates.

            > Powered by [AETHER](https://github.com/GHOSTxASR/AETHER) by [GHOSTxASR](https://github.com/GHOSTxASR) under [GPL-3.0](LICENSE).

            ### What's new
            - **Lyrics from Seven Libraries & Verse**: lrc.red, BiniLyrics, BetterLyrics, LyricsPlus, Unison, LRCLIB and KuGou queried together, drawn word-by-word in the new Verse view, Constellations, or Continuous Line.
            - **On-Device Script Romanisation**: Korean, Chinese pinyin, Japanese kana, and other scripts transliterated privately on device.
            - **Crossfade & Exact Copy Upgrade**: 2–12 second crossfade (respecting gapless album transitions) and seamless mid-song switching to lossless/exact copies from custom addon sources (DASH/HLS supported).
            - **Music Videos & Offline Albums**: Play music videos at up to 1080p/720p in place of artwork, browse on-phone and kept music as album shelves, and export kept tracks cleanly to `Music/Aura` with artwork and LRC metadata tags.
            - **In-App Updates & Full Screen**: Automatic GitHub release checks with SHA-256 verification and immersive full-screen toggle.
            - **Float32 & Bit-Perfect DAC Output**: Honest signal path directly to external USB DACs without resampling.
            
            ### Installation
            Download `Aura-Music-${{ github.ref_name || inputs.tag_name }}.apk` and open it on your Android device (Android 10+ required).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
