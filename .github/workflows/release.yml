name: Release Aura Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.5)'
        required: true
        default: 'v1.0.5'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK Licenses & Permissions
        run: |
          chmod +x android/gradlew
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Ensure Persistent Keystore Exists
        run: |
          if [ ! -f android/app/aura-release-key.jks ]; then
            echo "Generating persistent release keystore..."
            keytool -genkey -v -keystore android/app/aura-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias aura-key -storepass auramusic123 -keypass auramusic123 \
              -dname "CN=Anshuman Kumar, OU=AuraMusic, O=Aura, L=Bengaluru, S=KA, C=IN"
          else
            echo "Persistent keystore android/app/aura-release-key.jks verified."
            keytool -list -keystore android/app/aura-release-key.jks -storepass auramusic123 -alias aura-key || true
          fi

      - name: Install Dependencies
        run: npm ci || npm install
        env:
          CI: 'true'

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android --inline
        env:
          CAPACITOR_TELEMETRY: 'false'
          CI: 'true'

      - name: Compile Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Stage Release APK & Checksum
        run: |
          mkdir -p release_assets
          TAG_VAL="${{ github.ref_name || inputs.tag_name || 'v1.0.5' }}"
          
          # Find release APK
          APK_FILE=$(find android/app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_assets/AuraMusic-release.apk
            cp "$APK_FILE" "release_assets/Aura-Music-${TAG_VAL}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum AuraMusic-release.apk > AuraMusic-release.apk.sha256
          sha256sum "Aura-Music-${TAG_VAL}.apk" > "Aura-Music-${TAG_VAL}.apk.sha256"
          echo "Generated APK Assets:"
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/AuraMusic-release.apk
            release_assets/AuraMusic-release.apk.sha256
            release_assets/Aura-Music-*.apk
            release_assets/Aura-Music-*.apk.sha256
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Aura Music ${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
