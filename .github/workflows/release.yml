name: Release Aura Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Compile Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Stage Release APK & Checksum
        run: |
          mkdir -p release_assets
          # Locate built APK
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release_assets/AuraMusic-release.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release_assets/AuraMusic-release.apk
          else
            find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_assets/AuraMusic-release.apk \;
          fi
          
          # Generate SHA256 checksum
          cd release_assets
          sha256sum AuraMusic-release.apk > AuraMusic-release.apk.sha256
          echo "Generated APK Assets:"
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/AuraMusic-release.apk
            release_assets/AuraMusic-release.apk.sha256
          name: "Aura Music ${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
