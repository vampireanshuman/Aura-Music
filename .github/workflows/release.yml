name: Release Aura Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Permissions
        run: |
          chmod +x android/gradlew
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci || npm install
        env:
          CI: 'true'

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          CAPACITOR_TELEMETRY: 'false'
          CI: 'true'

      - name: Compile Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Stage Release APK & Checksum
        run: |
          mkdir -p release_assets
          # Locate built APK
          APK_FILE=$(find android/app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_assets/AuraMusic-release.apk
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          # Generate SHA256 checksum
          cd release_assets
          sha256sum AuraMusic-release.apk > AuraMusic-release.apk.sha256
          echo "Generated APK Assets:"
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/AuraMusic-release.apk
            release_assets/AuraMusic-release.apk.sha256
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Aura Music ${{ github.ref_name || inputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
