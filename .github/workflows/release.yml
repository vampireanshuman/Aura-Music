name: Release Aura Music

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v3.1.2)'
        required: true
        default: 'v3.1.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Setup API 37
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Persistent Release Keystore
        run: |
          echo "Restoring persistent release keystore..."
          echo "" | base64 -d > aura-release-key.jks
          cp aura-release-key.jks app/aura-release-key.jks
          cat << 'EOF' > keystore.properties
          storeFile=aura-release-key.jks
          storePassword=auramusic123
          keyAlias=aura-key
          keyPassword=auramusic123
          EOF

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :core:lyrics:test :core:automix:test :player:testDebugUnitTest :sources:addon:test :sources:canvas:test :sources:youtube:test :ytmusic:test --stacktrace

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          AURA_KEYSTORE_FILE: aura-release-key.jks
          AURA_KEYSTORE_PASSWORD: auramusic123
          AURA_KEY_ALIAS: aura-key
          AURA_KEY_PASSWORD: auramusic123
          AETHER_KEYSTORE_FILE: aura-release-key.jks
          AETHER_KEYSTORE_PASSWORD: auramusic123
          AETHER_KEY_ALIAS: aura-key
          AETHER_KEY_PASSWORD: auramusic123

      - name: Stage Release APK & Checksums
        run: |
          rm -rf release_assets
          mkdir -p release_assets
          TAG_VAL="${{ github.ref_name || inputs.tag_name || 'v3.1.2' }}"
          
          # Find release APK
          APK_FILE=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_assets/AuraMusic-release.apk
            cp "$APK_FILE" "release_assets/Aura-Music-${TAG_VAL}.apk"
            cp "$APK_FILE" "release_assets/Aura-${TAG_VAL}.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi
          
          # Generate SHA256 checksums
          cd release_assets
          sha256sum AuraMusic-release.apk > AuraMusic-release.apk.sha256
          sha256sum "Aura-Music-${TAG_VAL}.apk" > "Aura-Music-${TAG_VAL}.apk.sha256"
          sha256sum "Aura-${TAG_VAL}.apk" > "Aura-${TAG_VAL}.apk.sha256"
          echo "Release artifacts staged:"
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/*.apk
            release_assets/*.apk.sha256
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: "Aura Music ${{ github.ref_name || inputs.tag_name }}"
          body: |
            **Aura Music ${{ github.ref_name || inputs.tag_name }}** restores Aura branding across every screen of the app alongside all v3.1 features and in-app updates.

            > Powered by [AETHER](https://github.com/GHOSTxASR/AETHER) by [GHOSTxASR](https://github.com/GHOSTxASR) under [GPL-3.0](LICENSE).

            ### Fixed in v3.1.2
            - **Aura Branding Restored Everywhere**: Replaced leftover `Aether` / `AETHER` UI copy in onboarding, colophon, Now Playing cover microtype (`AURA`), Profile & Song cards (`Pictures/Aura`, `Aura card`), Kept music folder (`Music/Aura`), Settings, lyrics attribution, sign-in & permission prompts, and crash notes.

            ### Also in 3.1
            - In-app updates (**Download and install**), bidirectional YouTube Music sync, 2x2 and 4x2 home-screen widgets, ambient cover lighting, per-list sorting, ALAC decoding, EBU R128 ReplayGain, USB DAC bit-perfect output on Android 14+, parallel chunked downloads, and Samsung FLAC fix.

            ### Installation
            Download `Aura-Music-${{ github.ref_name || inputs.tag_name }}.apk` and open it on your Android device (Android 10+ required), or update directly inside Aura (`v3.1.1`).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
